<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snooze a tab · Chrontab</title>
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header class="popup-header">
      <a class="brand" href="dashboard.html" target="_blank"
        ><span class="brand-mark" data-icon="logo"></span> Chrontab</a
      ><button
        id="manage"
        class="icon-button"
        aria-label="Manage snoozed tabs"
        title="Manage snoozed tabs"
      >
        <span data-icon="open-in-new"></span>
      </button>
    </header>
    <div class="popup-appearance">
      <span>Appearance</span>
      <div id="theme-controls"></div>
    </div>
    <main>
      <div class="eyebrow">A LITTLE ROOM TO FOCUS</div>
      <h1>This tab can wait.</h1>
      <p class="muted">Close it now. Bring it back when it matters.</p>
      <div id="current-tab" class="current-tab">
        <span class="tab-symbol" data-icon="tab"></span>
        <div><strong id="tab-title">Loading current tab…</strong><span id="tab-domain"></span></div>
      </div>
      <div id="editor"></div>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <footer class="popup-footer">
      <span class="status-dot" data-icon="database-check"></span> Stored on this device. Just for
      you.
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
